model_list:
  # Rota curinga: o nome pedido pelo cliente vira o modelo do Ollama.
  # Exemplo: "llama3.2" -> "ollama/llama3.2".
  - model_name: "ollama/*"
    litellm_params:
      model: "ollama/*"
      api_base: os.environ/OLLAMA_API_BASE
      input_cost_per_token: 0
      output_cost_per_token: 0

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY

litellm_settings:
  drop_params: true
